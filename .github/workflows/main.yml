name: Build Cardputer Test

on:
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        pip install rich-click

    - name: Build Project
      run: |
        pio run -e cardputer

    - name: Merge Binaries
      run: |
        pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin \
          --flash_mode dio --flash_freq 80m --flash_size 8MB \
          0x0 .pio/build/cardputer/bootloader.bin \
          0x8000 .pio/build/cardputer/partitions.bin \
          0x10000 .pio/build/cardputer/firmware.bin

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: cardputer-firmware
        path: merged-firmware.bin
